[project]
name = "pyoutlineapi"
version = "0.4.0"
description = "Production-ready async Python client for Outline VPN Server API with enterprise-grade features and full type safety."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10,<4.0"

authors = [
    { name = "Denis Rozhnovskiy", email = "pytelemonbot@mail.ru" }
]

keywords = [
    "outline",
    "vpn",
    "api",
    "async",
    "asyncio",
    "aiohttp",
    "pydantic",
    "client",
    "manager",
    "production",
    "enterprise",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Framework :: aiohttp",
    "Framework :: Pydantic",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Security",
    "Topic :: System :: Networking",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "aiohttp>=3.13.2",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
]

[project.urls]
Homepage = "https://github.com/orenlab/pyoutlineapi"
Repository = "https://github.com/orenlab/pyoutlineapi"
Documentation = "https://orenlab.github.io/pyoutlineapi/"
Changelog = "https://github.com/orenlab/pyoutlineapi/blob/main/CHANGELOG.md"
"Bug Tracker" = "https://github.com/orenlab/pyoutlineapi/issues"
Discussions = "https://github.com/orenlab/pyoutlineapi/discussions"


[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.6",
    "aioresponses>=0.7.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-aiofiles>=24.1",
    "pdoc>=15.0",
    "rich>=14.2",
    "bandit>=1.8",
    "codeclone>=1.4.0",
]

# ================== Documentation ==================

[tool.pdoc]
output_directory = "docs"
math = true
search = true
show_source = true

[tool.pdoc.pdoc]
docformat = "google"
include_undocumented = false
show_inherited_members = true
members_order = "alphabetical"


# ================== Pytest ==================

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

addopts = [
    "-v",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
    "--maxfail=5",
    "--cov=pyoutlineapi",
    "--cov-branch",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=80",
]

markers = [
    "unit",
    "integration",
    "slow",
    "network",
]

filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

timeout = 300
timeout_method = "thread"


# ================== Coverage ==================

[tool.coverage.run]
source = ["pyoutlineapi"]
branch = true
omit = [
    "tests/*",
    "**/__pycache__/*",
    "**/site-packages/*",
]

[tool.coverage.report]
precision = 2
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"


# ================== Ruff ==================

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I",
    "UP", "B", "C4", "SIM",
    "RUF", "D", "ANN",
    "S", "ASYNC", "PT",
]
ignore = [
    "E501",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "ANN", "D", "PLR2004"]
"__init__.py" = ["F401", "D104"]
"examples/*" = ["T201"]

[tool.ruff.lint.isort]
known-first-party = ["pyoutlineapi"]
combine-as-imports = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"


# ================== MyPy ==================

[tool.mypy]
python_version = "3.10"
files = ["pyoutlineapi"]

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_unreachable = true
show_error_codes = true
pretty = true

strict_optional = true
implicit_reexport = true

[[tool.mypy.overrides]]
module = ["aiohttp.*", "aioresponses.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pydantic", "pydantic.*", "pydantic_settings"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
check_untyped_defs = false


# ================== Bandit ==================

[tool.bandit]
exclude_dirs = ["tests", "docs", "examples"]
skips = ["B101"]


# ================== Build ==================

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pyoutlineapi"]